AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - 'AWS::LanguageExtensions'
  - 'AWS::Serverless-2016-10-31'
Description: >
  A CloudFormation/SAM template to deploy a Django application on AWS utilizing a fully serverless architecture.

Parameters:
  ProjectId:
    Description: ID of the project used for resource identification and tagging
    Type: String
    Default: aws-iac-django-serverless-starter
    AllowedPattern: ^[a-zA-Z0-9-]+$
    ConstraintDescription: Project name must contain only letters, numbers, and hyphens

  Environment:
    Description: Deployment environment that determines resource configuration
    Type: String
    Default: DEV
    AllowedValues:
      - DEV
    ConstraintDescription: Only DEV is supported

  SecretKey:
    Description: >
      Secret key for hashing and signing.
      For development purposes only. In production, the secret key must be generated, stored, and retrieved securely.
    Type: String
    Default: '00000000000000000000000000000000000000000000000000'
    MinLength: 50
    MaxLength: 200

  LambdaRuntime:
    Description: Python runtime version for Lambda functions
    Type: String
    Default: python3.12
    AllowedValues:
      - python3.12
    ConstraintDescription: Currently only Python 3.12 is supported

  LambdaMemorySize:
    Description: Memory allocation (MB) for API Lambda functions
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    ConstraintDescription: Must be between 1024 and 10240 MB

  LambdaTimeout:
    Description: Maximum execution time (seconds) for API Lambda functions
    Type: Number
    Default: 28
    MinValue: 5
    MaxValue: 28
    ConstraintDescription: Must be between 5 and 28 seconds (API Gateway limit is 29 seconds)

  LambdaArchitecture:
    Description: CPU architecture for Lambda functions
    Type: String
    Default: arm64
    AllowedValues:
      - x86
      - arm64
    ConstraintDescription: Must be either arm64 (AWS Graviton) or x86 (Intel/AMD)

  LambdaMountedFileSystemPath:
    Description: Path to the mounted file system
    Type: String
    Default: /mnt/fs

  LogGroupsRetentionPeriod:
    Description: Number of days to retain CloudWatch logs
    Type: Number
    Default: 180
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    ConstraintDescription: Must be one of the allowed AWS CloudWatch log retention periods

  HttpApiRateLimit:
    Description: Maximum number of requests per second
    Type: Number
    Default: 1
    MinValue: 1

  HttpApiBurstLimit:
    Description: Burst limit
    Type: Number
    Default: 1
    MinValue: 1

  VpcCidrBlock:
    Description: |
      IPv4 CIDR block for the VPC network (RFC 1918 private ranges only)
      Example: 192.168.0.0/16 provides 65,534 usable IP addresses
    Type: String
    Default: 192.168.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([1-9]|[1-2][0-9]|3[0-2]))$
    ConstraintDescription: Must be a valid IPv4 CIDR block from RFC 1918 private ranges

Mappings:
  Architecture:
    Lambda:
      # Maps parameter input to Lambda architecture value
      # Note: x86 is used instead of x86_64 due to alphanumeric constraint
      x86: x86_64
      arm64: arm64
    WebAdapter:
      # Maps architecture to AWS Lambda Web Adapter format
      # Ref: github.com/awslabs/aws-lambda-web-adapter
      x86: X86
      arm64: Arm64

Resources:
  Vpc:
    # Virtual Private Cloud (VPC) to isolate network resources and enable custom network configuration
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidrBlock
      EnableDnsHostnames: True
      EnableDnsSupport: True
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EC2
        - Key: ResourceType
          Value: VPC
  
  VpcRouteTable:
    # Primary route table for managing VPC traffic routing
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EC2
        - Key: ResourceType
          Value: RouteTable

  VpcSubnetA:
    # Subnet in Availability Zone A with IPv4 support
    Type: AWS::EC2::Subnet
    Properties:
      # Cidr function format: !Cidr [ipBlock, count, cidrBits]
      # IPv4: allocate a /19 prefix from the VPC's /16 block (16,384 usable IPs)
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidrBlock, 3, 14]]
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EC2
        - Key: ResourceType
          Value: Subnet

  VpcSubnetB:
    # Subnet in Availability Zone B with IPv4 support
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidrBlock, 3, 14]]
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EC2
        - Key: ResourceType
          Value: Subnet

  VpcSubnetC:
    # Subnet in Availability Zone C with IPv4 support
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidrBlock, 3, 14]]
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EC2
        - Key: ResourceType
          Value: Subnet

  VpcSubnetARouteTableAssociation:
    # Associates route table with Subnet in Availability Zone A
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VpcSubnetA
      RouteTableId: !Ref VpcRouteTable

  VpcSubnetBRouteTableAssociation:
    # Associates route table with Subnet in Availability Zone B
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VpcSubnetB
      RouteTableId: !Ref VpcRouteTable

  VpcSubnetCRouteTableAssociation:
    # Associates route table with Subnet in Availability Zone C
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VpcSubnetC
      RouteTableId: !Ref VpcRouteTable

  FileSystem:
    # Elastic File System
    Type: AWS::EFS::FileSystem
    # DeletionPolicy attribute
    # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-deletionpolicy.html
    DeletionPolicy: Delete
    # UpdateReplacePolicy attribute
    # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-updatereplacepolicy.html
    UpdateReplacePolicy: Delete
    Properties:
      PerformanceMode: generalPurpose
      Encrypted: true
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
            Principal:
              AWS: '*'
      FileSystemTags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EFS
        - Key: ResourceType
          Value: FileSystem

  FileSystemMountTargetA:
    # EFS mount target for subnet A
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref VpcSubnetA
      SecurityGroups:
        - !GetAtt Vpc.DefaultSecurityGroup

  FileSystemMountTargetB:
    # EFS mount target for subnet B
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref VpcSubnetB
      SecurityGroups:
        - !GetAtt Vpc.DefaultSecurityGroup

  FileSystemMountTargetC:
    # EFS mount target for subnet C
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref VpcSubnetC
      SecurityGroups:
        - !GetAtt Vpc.DefaultSecurityGroup

  FileSystemAccessPoint:
    # EFS access point
    Type: AWS::EFS::AccessPoint
    # All mount targets must be listed in DependsOn otherwise Lambda creation will fail.
    # These dependencies can be added directly to the Lambda functions, however it is
    # easier to manage them in one place.
    DependsOn:
      - FileSystemMountTargetA
      - FileSystemMountTargetB
      - FileSystemMountTargetC
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerGid: '1000'
          OwnerUid: '1000'
          Permissions: '0777'
        Path: /lambda
      AccessPointTags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: EFS
        - Key: ResourceType
          Value: AccessPoint

  HttpApiLogGroup:
    # CloudWatch log group for capturing HTTP API logs
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupClass: STANDARD
      RetentionInDays: !Ref LogGroupsRetentionPeriod
      LogGroupName: !Sub "/aws/api-gateway/${AWS::StackName}-HttpApi-${HttpApi}"
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: Logs
        - Key: ResourceType
          Value: LogGroup

  HttpApi:
    # HTTP API for Lambda function integration
    Type: AWS::Serverless::HttpApi
    Description: HTTP API
    Properties:
      Description: !Sub "HTTP API for ${ProjectId} (${Environment})"
      DisableExecuteApiEndpoint: false
      FailOnWarnings: false
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref HttpApiBurstLimit
        ThrottlingRateLimit: !Ref HttpApiRateLimit
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        # The Missing Guide to AWS API Gateway Access Logs
        # https://www.alexdebrie.com/posts/api-gateway-access-logs/
        Format: '{"requestTime":"$context.requestTime","requestId":"$context.requestId","httpMethod":"$context.httpMethod","path":"$context.path","routeKey":"$context.routeKey","status":$context.status,"responseLatency":$context.responseLatency,"integrationRequestId":"$context.integration.requestId","functionResponseStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","integrationServiceStatus":"$context.integration.integrationStatus","ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent","principalId":"$context.authorizer.principalId"}'
      Tags:
        ProjectId: !Ref ProjectId
        Environment: !Ref Environment
        ResourceGroup: Serverless
        ResourceType: HttpApi
  
  FunctionExecutionRole:
    # Execution role for the Lambda function that allows it to write logs, connect
    # to the VPC, and access the EFS
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: LogsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: VpcPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AttachNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
        - PolicyName: EfsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientRootAccess
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:DescribeMountTargets
                Resource: '*'
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: Serverless
        - Key: ResourceType
          Value: HttpApi

  FunctionLogGroup:
    # CloudWatch log group for the Lambda function
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupClass: STANDARD
      LogGroupName: !Sub "/aws/lambda/${Function}"
      RetentionInDays: !Ref LogGroupsRetentionPeriod
      Tags:
        - Key: ProjectId
          Value: !Ref ProjectId
        - Key: Environment
          Value: !Ref Environment
        - Key: ResourceGroup
          Value: Logs
        - Key: ResourceType
          Value: LogGroup

  Function:
    Type: AWS::Serverless::Function
    Description: Lambda function for the Django app
    Properties:
      Layers:
        # Add the AWS Lambda Web Adapter layer with the corresponding architecture
        # https://github.com/awslabs/aws-lambda-web-adapter
        - !Sub 
          - "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayer${Architecture}:23"
          - Architecture: !FindInMap [Architecture, WebAdapter, !Ref LambdaArchitecture]
      CodeUri: src/
      # The AWS Lambda Web Adapter wrapper script set in AWS_LAMBDA_EXEC_WRAPPER will execute
      # this handler script to boot up the application
      Handler: launch.sh
      Role: !GetAtt FunctionExecutionRole.Arn
      Architectures:
        - !FindInMap [Architecture, Lambda, !Ref LambdaArchitecture]
      Runtime: !Ref LambdaRuntime
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          # Application variables
          ENVIRONMENT: !Ref Environment  # Current environment
          MOUNTED_FILE_SYSTEM_PATH: !Ref LambdaMountedFileSystemPath  # Path to the EFS
          SECRET_KEY: !Ref SecretKey
          # AWS Lambda Web Adapter variables
          # https://github.com/awslabs/aws-lambda-web-adapter
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap  # Wrapper script
          # When a new Lambda Execution Environment starts up, Lambda Web Adapter will send
          # an HTTP GET request to the following path and expects it to be successful.
          #
          # This can be any path however it shouldn't perform any database queries because
          # the database might not be initialized yet which would cause the readiness check
          # to fail.
          AWS_LWA_READINESS_CHECK_PATH: /events
          AWS_LWA_PORT: 8080  # Traffic port
          # The path for receiving event payloads that are passed through from non-http triggers
          AWS_LWA_PASS_THROUGH_PATH: /events 
      VpcConfig:
        # Use the !Split function to split a comma-separated string into an array
        SecurityGroupIds: !Split [',', !GetAtt Vpc.DefaultSecurityGroup]
        SubnetIds:
          - !Ref VpcSubnetA
          - !Ref VpcSubnetB
          - !Ref VpcSubnetC
      FileSystemConfigs:
        - Arn: !GetAtt FileSystemAccessPoint.Arn
          LocalMountPath: !Ref LambdaMountedFileSystemPath
      Events:
        # HTTP API
        # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-function-httpapi.html
        ApiEdnpoint:
          Type: HttpApi
          Properties:
            # If no Path and Method are specified, SAM will create a default API
            # path that routes any request that doesn't map to a different endpoint
            # to this Lambda function.
            ApiId: !Ref HttpApi
            TimeoutInMillis: 29000  # Set the maximum value: 29 seconds
      Tags:
        ProjectId: !Ref ProjectId
        Environment: !Ref Environment
        ResourceGroup: Serverless
        ResourceType: Function

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc

  VpcSubnetAId:
    Description: ID of the first VPC subnet (Subnet A)
    Value: !Ref VpcSubnetA

  VpcSubnetBId:
    Description: ID of the second VPC subnet (Subnet B)
    Value: !Ref VpcSubnetB

  VpcSubnetCId:
    Description: ID of the third VPC subnet (Subnet C)
    Value: !Ref VpcSubnetC

  FileSystemId:
    Description: ID of the Elastic File System (EFS)
    Value: !Ref FileSystem

  FileSystemAccessPointId:
    Description: ID of the EFS access point
    Value: !Ref FileSystemAccessPoint

  HttpApiLogGroupArn:
    Description: ARN of the HTTP API log group
    Value: !GetAtt HttpApiLogGroup.Arn

  HttpApiId:
    Description: ID of the HTTP API
    Value: !Ref HttpApi

  HttpApiUrl:
    Description: Invoke URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"

  FunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt Function.Arn

  FunctionName:
    Description: Name of the Lambda function
    Value: !Ref Function

  FunctionLogGroupArn:
    Description: ARN of the log group for the Lambda function
    Value: !GetAtt FunctionLogGroup.Arn